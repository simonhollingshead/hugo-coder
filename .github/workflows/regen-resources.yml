name: Regenerate CSS Resources

on:
  workflow_dispatch:
  push:
    branches:
      - patched
  schedule:
    - cron: '47 2 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      # Only ever run one at a time to avoid conflicting updates.
      group: ${{ github.workflow }}
      cancel-in-progress: true

    steps:      
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: patched

      - name: Install Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: 0.169.0  # This should be 'latest' but 0.170.0 removes extended and requires SASS to be installed separately.
          extended: true

      - name: Remove Existing exampleSite Resources
        run: rm -rf exampleSite/resources

      - name: Build Example Site
        working-directory: exampleSite
        run: hugo --theme='../..'

      - name: Replace Top-Level Resource Dir
        run: |
          rm -rf resources
          cp -r exampleSite/resources resources

      - name: Commit Back Changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          branch: patched
          file_pattern: 'resources/** exampleSite/resources/**'
          commit_message: Regenerate CSS from SCSS
          # push_options: --dry-run
